name: Build firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: sed -i "s|^platform *=.*|platform = https://github.com/${{ github.repository }}|" platformio.ini
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: k6-firmware
          path: out/
